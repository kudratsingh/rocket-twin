  <text x="68" y="821" fill="#15334a" font-size="16" font-family="Arial">Net addition to frozen balanced RP1: 3.400 g; physical inertia unavailable; full flight not run.</text>
  <text x="68" y="851" fill="#15334a" font-size="16" font-family="Arial">Formal 15 m/s and separate planning 15.5 m/s at 1.5 m usable guide; longer usable travel is conditional equipment.</text>
  <text x="68" y="881" fill="#ab3a31" font-size="16" font-family="Arial">The 68 g commerce metadata has no reliable unit/scope and is a sensitivity probe, not a mass bound.</text>
