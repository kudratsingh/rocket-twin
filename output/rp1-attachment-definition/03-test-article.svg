  <text x="271.5" y="435" fill="#526778" font-size="14" font-family="Arial" text-anchor="middle">60 mm fore grip</text>
  <rect x="1185" y="136" width="340" height="32" fill="#fce9e7" stroke="#ab3a31" rx="5" />
  <text x="1195" y="159" fill="#ab3a31" font-size="14" font-family="Arial" font-weight="bold">NO LIVE MOTOR</text>
  <text x="48" y="489" fill="#ab3a31" font-size="16" font-family="Arial">Grip is a proposed split saddle with compliant liner. Measure slip, ovalization and reaction distribution; do not model it as fixed.</text>
  <text x="48" y="528" fill="#15334a" font-size="20" font-family="Arial" font-weight="bold">B  ASSEMBLY AND INSPECTION SEQUENCE</text>
  <rect x="52" y="565" width="1596" height="79" fill="#ffffff" stroke="#b8c8d1" rx="6" />
  <text x="68" y="593" fill="#087f78" font-size="17" font-family="Arial" font-weight="bold">01  Stock and cuts</text>
  <text x="390" y="593" fill="#15334a" font-size="15" font-family="Arial">Same identified body/mount stock; minimum ply; inspect ring/slot, roundover and conditioned adhesive batch.</text>
  <rect x="52" y="662" width="1596" height="79" fill="#ffffff" stroke="#b8c8d1" rx="6" />
  <text x="68" y="690" fill="#087f78" font-size="17" font-family="Arial" font-weight="bold">02  Fin / ring joints</text>
  <text x="390" y="690" fill="#15334a" font-size="15" font-family="Arial">Build representative tabs, fillets, gussets and aft adhesive; inspect actual coverage and gaps.</text>
  <rect x="52" y="759" width="1596" height="79" fill="#ffffff" stroke="#b8c8d1" rx="6" />
  <text x="68" y="787" fill="#087f78" font-size="17" font-family="Arial" font-weight="bold">03  Recovery route</text>
  <text x="390" y="787" fill="#15334a" font-size="15" font-family="Arial">Reeve source Kevlar; preserve factory nylon loops; mark knot tails, guard and accessible junction.</text>
  <rect x="52" y="856" width="1596" height="79" fill="#ffffff" stroke="#b8c8d1" rx="6" />
  <text x="68" y="884" fill="#087f78" font-size="17" font-family="Arial" font-weight="bold">04  Fit the fixture</text>
  <text x="390" y="884" fill="#15334a" font-size="15" font-family="Arial">Engage 60 mm proposed fore grip; verify no tube crush/slip and document load/reaction path.</text>
  <rect x="52" y="953" width="1596" height="79" fill="#ffffff" stroke="#b8c8d1" rx="6" />
  <text x="68" y="981" fill="#ab3a31" font-size="17" font-family="Arial" font-weight="bold">05  Owner test hold</text>
  <text x="390" y="981" fill="#15334a" font-size="15" font-family="Arial">Review grips, guards, calibration, hot setup and loading protocol before any physical loading.</text>
  <text x="48" y="1081" fill="#ab3a31" font-size="16" font-family="Arial">Proposed load-system range ≥ 5,000 N. No owner hardware, test date, fixture qualification or physical result is recorded.</text>
  <line x1="48" y1="1122" x2="1652" y2="1122" stroke="#c5d1d9" stroke-width="1" />
