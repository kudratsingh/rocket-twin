  <text x="48" y="56" fill="#15334a" font-size="30" font-family="Arial" font-weight="bold">RP1-AD1 sacrificial attachment test article</text>
  <text x="48" y="87" fill="#526778" font-size="17" font-family="Arial">Representative 240 mm station segment and proposed fixture sequence; no live motor or released test</text>
  <rect x="1375" y="31" width="273" height="39" fill="#fff0cc" stroke="#d4af61" rx="7" />
  <text x="1391" y="57" fill="#986500" font-size="18" font-family="Arial" font-weight="bold">OWNER TEST HOLD</text>
  <text x="48" y="136" fill="#15334a" font-size="20" font-family="Arial" font-weight="bold">A  DIMENSIONED VEHICLE-STATION ARTICLE</text>
