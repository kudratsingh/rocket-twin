  <text x="1391" y="864" fill="#15334a" font-size="16" font-family="Arial">Outside mouth</text>
  <text x="1391" y="901" fill="#526778" font-size="13" font-family="Arial">Loop-to-loop accessible</text>
  <text x="1391" y="918" fill="#526778" font-size="13" font-family="Arial">junction</text>
  <text x="385" y="972" fill="#526778" font-size="16" font-family="Arial">Available external reach 338.513 mm against proposed minimum 300 mm; this is geometry only.</text>
  <text x="385" y="996" fill="#526778" font-size="16" font-family="Arial">Factory LOC nylon loops remain uncut. Kevlar raw cut 1,981.2 mm; exact finished bearing length unavailable.</text>
  <text x="385" y="1020" fill="#526778" font-size="16" font-family="Arial">Finite connector, packing, chafe, hot cord and installed load capacity remain unverified.</text>
