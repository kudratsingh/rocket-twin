  <text x="986" y="901" fill="#526778" font-size="13" font-family="Arial">z980–1060 mm; no credited</text>
  <text x="986" y="918" fill="#526778" font-size="13" font-family="Arial">heat capacity</text>
  <polyline points="1260,875 1370,875" fill="none" stroke="#b3482b" stroke-width="4" stroke-linejoin="round" />
