  <text x="606.6000000000001" y="503" fill="#526778" font-size="14" font-family="Arial" text-anchor="middle">moved ring 12.2 mm</text>
  <text x="48" y="554" fill="#15334a" font-size="16" font-family="Arial">Wrap z 1072.2–1077.0 mm; motor tube OD 31.369 mm</text>
  <text x="48" y="583" fill="#15334a" font-size="16" font-family="Arial">Forward ring z 1060–1072.2 mm; aft ring begins z 1190 mm</text>
  <text x="48" y="615" fill="#ab3a31" font-size="16" font-family="Arial">Knot reservation [50, 20, 14] mm at z 1077.0–1127.0; R [16.5, 30.5] mm is a BOX, not a checked knot.</text>
  <text x="48" y="637" fill="#ab3a31" font-size="15" font-family="Arial">Sleeve z 980–1060 mm stays ahead of ring; bare rounded passage, cord and sleeve end have NO thermal/chafe capacity credit.</text>
  <text x="48" y="684" fill="#15334a" font-size="20" font-family="Arial" font-weight="bold">B  MOTOR-END SYMBOL AND ACCESSIBLE FORWARD JUNCTION</text>
