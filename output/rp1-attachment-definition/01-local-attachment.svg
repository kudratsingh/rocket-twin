  <text x="385" y="763" fill="#15334a" font-size="17" font-family="Arial">60° passage: 4.5 mm width × 5 mm depth</text>
  <text x="385" y="794" fill="#15334a" font-size="16" font-family="Arial">Edge roundover 2 mm; minimum per-flank 0.300 mm, conditional</text>
  <text x="385" y="824" fill="#ab3a31" font-size="16" font-family="Arial">Bare cord crosses passage. Bend radius and conditioned chafe/heat capacity unavailable.</text>
  <polyline points="440,875 735,875 970,875" fill="none" stroke="#b3482b" stroke-width="4" stroke-linejoin="round" />
