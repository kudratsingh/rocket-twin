  <text x="48" y="134" fill="#15334a" font-size="20" font-family="Arial" font-weight="bold">A  LOCAL LONGITUDINAL SECTION  |  z980–1220 mm</text>
  <text x="48" y="161" fill="#526778" font-size="15" font-family="Arial">Schematic radial spacing. Stations and sizes below are from the declared RP1-AD1 source.</text>
