  <text x="1440" y="250" fill="#bf8750" font-size="14" font-family="Arial">aft ring z1190–1196</text>
  <text x="1060" y="510" fill="#15334a" font-size="15" font-family="Arial">tab z1080.2–1189.6; no front-ring contact or direct aft butt stop</text>
  <text x="858" y="546" fill="#15334a" font-size="15" font-family="Arial">Knot box z1077–1127, R16.5–30.5 at 60°.</text>
  <text x="858" y="574" fill="#ad382e" font-size="15" font-family="Arial">Projected knot/fillet gap 1.375 mm; actual knot/packing and CAD motion unverified.</text>
  <text x="858" y="602" fill="#15334a" font-size="15" font-family="Arial">Recovery wrap/tab station clearance 3.050 mm; sleeve stays z980–1060.</text>
  <text x="858" y="630" fill="#ad382e" font-size="15" font-family="Arial">Bare rounded notch, thermal/chafe, motor service and installed contacts remain open.</text>
