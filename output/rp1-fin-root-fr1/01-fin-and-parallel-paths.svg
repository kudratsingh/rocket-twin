  <text x="168" y="554" fill="#ffffff" font-size="15" font-family="Arial">tab depth 17.451 mm; inner flat R15.95</text>
  <text x="48" y="705" fill="#15334a" font-size="16" font-family="Arial">204-11 nominal 3.175 mm; source min/max 2.921/3.429 mm.</text>
  <text x="48" y="733" fill="#15334a" font-size="16" font-family="Arial">Three fins; body slot 3.800 mm; conditional minimum per-flank 0.1355 mm.</text>
  <text x="48" y="762" fill="#ad382e" font-size="16" font-family="Arial">Continuous tab/mount and body/root fillets: nominal leg 6 mm, min 5.800 mm. No wood wedges.</text>
  <text x="858" y="139" fill="#15334a" font-size="20" font-family="Arial" font-weight="bold">B  STATIONED RING / WRAP / KNOT REGION</text>
  <text x="858" y="168" fill="#526778" font-size="15" font-family="Arial">Radial spacing schematic; station labels are sourced, knot shape is a reservation only.</text>
