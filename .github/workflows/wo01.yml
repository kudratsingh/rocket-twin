name: WO-01 checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  preliminary-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-wo01.txt
      - name: Install WO-01 and independent reference
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-wo01.txt rocketpy==1.13.0 scipy==1.17.1
      - name: Check, test and compare all modes
        run: make check smoke tiny benchmark
