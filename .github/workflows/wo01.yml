name: CPU checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: cpu-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  preliminary-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-wo01.txt
            requirements-wo02.txt
      - name: Install WO-01/02 and independent reference
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-wo02.txt
      - name: Check, test and compare all modes
        run: make check smoke tiny benchmark

      - name: WO-02 delivered-performance study
        run: .venv/bin/python scripts/wo02_sim.py --preset sim --study --compare rocketpy --require-benchmark --summary-only --json-report
