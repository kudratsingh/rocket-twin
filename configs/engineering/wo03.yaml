  case_boundary_basis: Explicit exploratory exterior-case-temperature bounds; no published
    or measured history for the exact offered G80/G54/G12 configuration is established.
    Step to peak at ignition through source burnout; exponential decay afterward.
    No internal propellant/combustion model or certification claim.
  material_property_uncertainty_fraction: 0.3
power:
  servo_rail_v: 5
  simultaneous_servo_stall_a: 2
  logic_peak_a: 0.5
  regulator_required_peak_a: 3
  regulator_efficiency_lower: 0.85
  recovery_supply: Dedicated battery and arming/isolation required; shared main-battery
    net is an unresolved integration defect until corrected.
  recovery_output_pulse_a: 1
  recovery_output_pulse_s: 1
  recovery_output_v: 6
  basis: Preliminary circuit-class assumptions, not measured or an igniter qualification;
    exact battery, regulator, connector, fuse, boost and initiator ratings remain
    WO-09/10.
vibration:
  youngs_fraction:
  - 0.5
  - 1.0
  joint_stiffness_fraction:
  - 0.1
  - 1.0
  joint_zone_half_length_m: 0.01
  damping_ratio:
  - 0.005
  - 0.03
  propulsion_excitation_band_hz:
  - 5
  - 300
  propulsion_spectrum_basis: Exploratory broadband range, not an exact-motor measured
    spectrum. No resonance exclusion/clearance claimed.
  servo_model_omega_rad_s: 20
  sensor_mount_stiffness_n_m:
  - 1000
  - 20000
  sensor_mount_stiffness_basis: Unmeasured carrier/fastener stiffness range; exact
    mount geometry and installed modal response remain required.
  shear_modulus_pa:
  - 200000000.0
  - 800000000.0
  shear_modulus_basis: Estimated plywood effective material shear range, unmeasured;
    torsion/root compliance and hot properties require coupons/installed tests.
  air_temperature_k:
  - 260
  - 310
  pressure_ratio:
  - 0.8
  - 1.0
  speed_envelope_mps: 300
  speed_envelope_basis: Exploratory conservative speed upper bound until current reconciled
    full-flight envelopes are attached; preserved WO02 is historical only.
  flutter_target_ratio_provisional: 1.2
  model_validity: Linear free-free 1D body beam and clamped fin shell; NACA4197 Eq18
    is preliminary bending-torsion only. Constant-thickness tapered fins violate constant
    thickness ratio; body/control/stall coupling remains unresolved.
