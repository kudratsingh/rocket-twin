stages:
- id: S0
  label: Documentation and inquiry
  status: not-authorized
  scope: Four product inquiries and one laboratory method and fixed-price request.
  entry: Only a separate contact authorization permits sending.
  decision: After a future authorized send, one follow-up on business day 5 and close
    documentation on business day 10. No message has been sent; the outreach clock
    has not started.
  part_ids:
  - test_strips
  - joint_witnesses
  - motor_tube
  - body
- id: S1
  label: Room-temperature pilot
  status: not-authorized
  scope: Ten bare wood strips and six curved paper/wood joint witnesses.
  entry: Written laboratory quote, substrate and process agreement, suitable method
    and separate authorization.
  decision: Stop if process, measurement, specimen or uncertainty evidence is inadequate.
  part_ids:
  - test_strips
  - joint_witnesses
  - motor_tube
  - body
- id: S2a
  label: Conditioned coupons and joints
  status: not-authorized
  scope: Twenty additional conditioned strips and twelve joint witnesses, subject
    to prior evidence.
  entry: S1 evidence supports further work; accepted method and separate authorization.
  decision: Evaluate conditioned evidence before considering independent root articles.
  part_ids:
  - test_strips
  - joint_witnesses
  - motor_tube
  - body
- id: S2b
  label: Independent complete-root articles
  status: not-authorized
  scope: Three independent 240 mm root articles; held pending earlier evidence.
  entry: Supported construction and material/strength screen, valid method and written
    quote, plus separate authorization.
  decision: Stop if complete-root method, fixture or construction is unsupported.
  part_ids:
  - fin_set
  - fin_tabs
  - motor_tube
  - body
  - forward_ring
  - aft_ring
  - harness_keepout
