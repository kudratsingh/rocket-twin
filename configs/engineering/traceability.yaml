ranking_basis:
  S4: Potential loss of control/structure or recovery with hazardous impact; critical
    release blocker.
  S3: Major performance/control degradation with independently verified recovery/containment;
    conditions may elevate to S4.
  likelihood: Qualitative mechanism-based assessment; no numeric failure rates or
    RPN without data.
requirements:
- id: RT-SCOPE-001
  applies_to: &id001
  - G80
  - G54
  - G12-F
  - G12-L
  purpose_source: Owner objectives; ADR-0006/0007
  acceptance: Certified-commercial no-HPR scope; loaded mass including allowance below
    declared cap, propellant and motor certification limits. Exact California/club
    eligibility is a separate release check.
  spec_paths:
  - limits.max_liftoff_mass_kg
  - limits.max_propellant_kg
  - motor.qualification.certified_impulse_ns
  - motor.qualification.certified_average_thrust_n
  related_parts:
  - motor
  - aft_shell
  interfaces:
  - IF-MOTOR-001
  - IF-CONFIG-001
  verification_method: Schema and source/certification check; later lot/club verification
  responsible_wo:
  - '01'
  - '03'
  - 09
  - '11'
  evidence: []
  status: open
  evidence_basis: Provisional design/specification unless an evidence record explicitly
    establishes otherwise.
- id: RT-PERF-001
  applies_to:
  - G80
  - G54
  purpose_source: Owner maximum practical conventional performance objective
  acceptance: Rank delivered flight performance with mass, structural, recovery and
    launch uncertainty. Keep G80 reference and G54 conditional; no fixed hardware
    selection solely by nominal impulse.
  spec_paths: []
  related_parts:
  - motor
  - fin_set
  - motor_mount
  interfaces:
  - IF-MOTOR-001
  verification_method: Source-hypothesis flight trade; revised geometry/mass comparison
  responsible_wo:
  - '02'
  - '03'
  - '11'
  evidence:
  - runs/wo02-20261030T173859843386Z/record.json
  - runs/wo02-20261030T204849990760Z/record.json
  - runs/wo03-integrated-20261030T211523356909Z/record.json
  status: baseline_numeric
  evidence_basis: Provisional design/specification unless an evidence record explicitly
    establishes otherwise.
- id: RT-GUIDE-001
  applies_to: *id001
  purpose_source: Active design screen; not launch authorization
  acceptance: Worst-case rail departure meets the current spec minimum at the specified
    usable travel, growth mass, thrust, friction and drag assumptions.
  spec_paths:
  - design.rail_length_m
  - design.minimum_rail_exit_mps
  - design.screening_wind_mps
  - design.rail_friction_n
  - design.thrust_scale_lower
  - design.mass_allowance_kg
  related_parts:
  - rail_guides
  - body_upper
  - motor
  interfaces:
  - IF-GUIDE-001
  verification_method: Rail integration and revised full-flight departure; equipment
    measurement
  responsible_wo:
  - '01'
  - '02'
  - '03'
  - 09
  - '11'
  evidence:
  - runs/wo02-20261030T173859843386Z/record.json
  - runs/wo02-20261030T204849990760Z/record.json
  - runs/wo03-integrated-20261030T211523356909Z/record.json
  - runs/wo03-recovery-budget-20261030T230910555661Z/record.json
  status: open
  evidence_basis: 'Current active G12 5 m usable-guide assumption is unconfirmed.
    Exact budget root retains 10 m/s, lower thrust/friction/drag and full 50 g growth:
    current dedicated111.034g, maximum119.767g. Candidate construction trades are
    not adopted.'
- id: RT-STAB-001
  applies_to:
  - G80
  - G54
  - G12-F
  purpose_source: Active passive-stability screen
  acceptance: Actual finned geometry meets the spec static margin over depletion and
    growth position. Finless negative margin is explicit and cannot pass this passive
    requirement.
  spec_paths:
  - design.minimum_static_margin_cal
  related_parts:
