fmea:
- id: FMEA-001
  failure_mode: Servo/rod/pivot jam
  applicable_configurations:
  - G12-F
  - G12-L
  cause: Interference, hot softening, misalignment, worn bearing or stalled/overloaded actuator.
  local_system_effect: Lost or stuck thrust-vector command; possible control loss.
  severity: S4 finless; S3/S4 finned depending recovery and loads
  likelihood: unknown
  likelihood_basis: No component/flight failure-rate data. Credibility follows mechanism and current unresolved
    interfaces, not a numeric probability.
  detection: Command/response, rate/current and estimator residual; exact feedback capability unresolved.
  mitigation_design_change: Swept/tolerance/load/thermal corrections, positive retention, loaded actuator
    model, jam detection and qualified recovery.
  residual_risk: Center command cannot move a jam; cannot shut off the solid motor or stabilize an unstable
    coast.
  verification_test: Hot/loaded range and injected jam through burnout/recovery.
  requirements:
  - RT-MOTION-001
  - RT-ABORT-001
  interfaces:
  - IF-GIMBAL-001
  status: open
- id: FMEA-002
  failure_mode: Brownout/common supply failure
  applicable_configurations: *id001
  cause: Simultaneous servo stalls, regulator droop, cell/connector short or control reset; initial reserve
    unit shares source battery.
  local_system_effect: Control and supposedly independent recovery can fail together.
  severity: S4
  likelihood: unknown
  likelihood_basis: No component/flight failure-rate data. Credibility follows mechanism and current unresolved
    interfaces, not a numeric probability.
  detection: Voltage/current/reset monitoring; blackout may prevent logging/detection.
  mitigation_design_change: Isolated reserve recovery source/driver/arming and fault containment; rail/connector
    budget. Integrated mode override was corrected; all six resolved recovery networks are regressed for
    dedicated battery/switch/return and separation from the main graph. Physical continuity, EMC and common-cause
    faults remain unqualified.
  residual_risk: Common harness, thermal, arming and physical damage can remain common causes; separation
    must be demonstrated.
  verification_test: Loaded brownout, short, unplug, reset and independent deployment tests.
  requirements:
  - RT-POWER-001
  - RT-RECOVERY-002
  interfaces:
  - IF-POWER-001
  - IF-RECOVERY-001
  status: open
- id: FMEA-003
  failure_mode: Sensor saturation/dropout/misalignment
  applicable_configurations: *id001
  cause: Low-g IMU clips at predicted acceleration; gyro saturation, aliasing, transport loss, wrong axis/calibration.
  local_system_effect: Estimator bias/loss; unsafe controller or missed recovery state.
  severity: S4 for uncontained control/recovery dependence
  likelihood: unknown
  likelihood_basis: No component/flight failure-rate data. Credibility follows mechanism and current unresolved
    interfaces, not a numeric probability.
  detection: Range/age/self-test and cross-sensor plausibility; high-g does not fix gyro saturation.
  mitigation_design_change: High-g path plus retained low-g gyro, timestamp/health handling and independent
    recovery sensing.
  residual_risk: Unmeasured bandwidth/delay, vibration and shared bus/power remain.
  verification_test: Clip/dropout/axis/latency and vibration aliasing injection/bench tests.
  requirements:
  - RT-SENSOR-001
  - RT-VIB-001
  - RT-ABORT-001
  interfaces:
  - IF-AVIONICS-001
  - IF-CONFIG-001
  status: open
- id: FMEA-004
  failure_mode: Connector/channel/polarity fault
  applicable_configurations: *id001
  cause: Swapped yaw/pitch, partial mating, strain, loose wire, reversed power or servo/pyro connector
    confusion.
  local_system_effect: Wrong/absent actuation, shorts or recovery loss/inadvertent initiation.
  severity: S4
  likelihood: unknown
  likelihood_basis: No component/flight failure-rate data. Credibility follows mechanism and current unresolved
    interfaces, not a numeric probability.
  detection: Continuity, polarity/channel tests, sensor/actuator response; some faults intermittent.
  mitigation_design_change: Keyed/polarized labeled connectors, strain relief, service access and safe
    arming procedure.
  residual_risk: Keying does not prove internal pinout or field assembly correctness.
  verification_test: Pull/flex/vibration, channel/sign, polarity and armed-state fault tests.
  requirements:
  - RT-CONFIG-001
  - RT-POWER-001
  - RT-RECOVERY-002
  interfaces:
  - IF-POWER-001
  - IF-GIMBAL-001
  status: open
- id: FMEA-005
  failure_mode: Structural load path/bond/retention failure
  applicable_configurations: *id001
  cause: Fin/root buckling, tube crushing, incomplete bond, weak print/grain direction or loose retention.
  local_system_effect: Loss of motor/fin/module/recovery attachment; trajectory or recovery failure.
  severity: S4
  likelihood: unknown
  likelihood_basis: No component/flight failure-rate data. Credibility follows mechanism and current unresolved
    interfaces, not a numeric probability.
  detection: Inspection, dimensional/proof tests; hidden bond defects may escape visual inspection.
  mitigation_design_change: Close load paths, reinforced interfaces, orientation and cure specification;
    verified/converged analyses. Separate G80 keeper/through-bolt geometry and staged service studies
    are proposed in docs/wo03-g80-keeper-service.md; no active adoption or strength pass follows from
    nominal restraints.
  residual_risk: 'C2 rejected: local receiver-pad bond, floor/movement and actual2D harness interference
    fail. Isolated sandwich-panel improvement is not installed acceptance; no next candidate admitted.
    C1/R1 bounded preflight in docs/wo03-c1-fin-attachment.md leaves installed acceptance open; bridge
    shear/movement and R1 mass/adverse stability fail. No rigid-ground, generic bearing, unavailable thermal
    or inherited panel/flutter credit. Estimated properties and assembly workmanship remain unqualified.
    C1 preserves those unresolved connection findings; swept tapered fins increase root moment to8.830Nm
    and new thin-shell/local-socket strength is unverified despite1.319cal calculated static margin. S3
    continuous end joints are dimensioned but not qualified; severe recovery cap sensitivity exceeds provisional
    screens, body serial cut and service fail, and full-growth stability is0.205cal. Longer guide does
    not mitigate those failures. The additive S2 receiver is also rejected; partial stock exceeds formal
    guide mass ceiling, while shell/fin/pin/hot-contact capacity remains unverified. No rigid support
    or unmodeled clipping closes a joint. S2 is not admitted; its independent carrier has no accepted
    positive fin-frame/body receiver, and its recorded foot gap is3.8mm. No loop preload or rigid support
    supplies that missing connection. The isolated G80 fixed-support mean shear exceeds its provisional
    hot screen; a positive load-path correction is required before acceptance. The bounded B/C proposals
    remain rejected at preflight; B moves force into unverified rail/pin joints; C conflicts with the
    coupler and hot-section screen. Short captured aft subframe plus aramid backbone is only the next
    direction. G80 bridge, keeper pads and M2 closures may share force; noncredited stiffness is not zero
    physical reaction. Installed load paths and later owner proof remain open.'
  verification_test: Coupons, pull/bending/bearing, buckling and recovery opening proof tests.
  requirements:
  - RT-LOAD-001
  - RT-LOAD-002
  - RT-FIT-001
  interfaces:
  - IF-MOTOR-001
  - IF-UPPER-AFT-001
  - IF-RECOVERY-001
  status: open
  evidence:
  - docs/wo03-a1-connection-decision.md
- id: FMEA-006
  failure_mode: Thermal degradation/heat soak
  applicable_configurations: *id001
  cause: Long G12 exposure or unknown case temperature, insufficient insulation/spacing, hot adhesive
    or wiring.
  local_system_effect: Mount/gimbal softening/jam, bond/structural failure or simultaneous electronics/recovery
    loss.
  severity: S4
  likelihood: unknown
  likelihood_basis: No component/flight failure-rate data. Credibility follows mechanism and current unresolved
    interfaces, not a numeric probability.
  detection: Temperature instrumentation and post-test inspection; in-flight response may be too late.
  mitigation_design_change: Bounded heat analysis, shield/air-gap/material revisions and temperature derating.
  residual_risk: C1/R1 bounded preflight in docs/wo03-c1-fin-attachment.md leaves installed acceptance
    open; bridge shear/movement and R1 mass/adverse stability fail. No rigid-ground, generic bearing,
    unavailable thermal or inherited panel/flutter credit. External case histories and property/contact
    bounds unmeasured; direct S2 case/carrier expansion and connector/strap temperature remain unqualified;
    case endplay can close in the stated sensitivity, making the commercial case an unintended structural
    strut. plume/hot gas not cleared by current lumped model.
  verification_test: Instrumented exact-motor burn/soak and hot-load/adhesive tests.
  requirements:
  - RT-THERM-001
  - RT-RECOVERY-002
  interfaces:
  - IF-MOTOR-001
  - IF-GIMBAL-001
  - IF-POWER-001
  status: open
  evidence:
  - docs/wo03-a1-connection-decision.md
- id: FMEA-007
  failure_mode: Wrong module/configuration pairing
  applicable_configurations: *id001
  cause: Threefold indexing ambiguity, stale policy/spec/motor hash, wrong fin state or incorrect mount/lot.
  local_system_effect: Wrong axes/mass/aero/control authority; invalid evidence and potential loss of
    control.
  severity: S4
  likelihood: unknown
  likelihood_basis: No component/flight failure-rate data. Credibility follows mechanism and current unresolved
    interfaces, not a numeric probability.
  detection: Pre-arm identity, presence/sign tests and physical markings.
  mitigation_design_change: Unique angular key, durable mode ID and firmware mismatch rejection; exact
    as-flown record.
  residual_risk: Angular indexing alone cannot identify every module type or prove motor lot.
  verification_test: Deliberate wrong-module/axis/motor/policy/firmware mismatch tests.
  requirements:
  - RT-CONFIG-001
  - RT-DATA-001
  interfaces:
  - IF-UPPER-AFT-001
  - IF-CONFIG-001
  status: open
- id: FMEA-008
  failure_mode: Recovery extraction/inflation/anchor failure
  applicable_configurations: *id001
  cause: Packing snag, crowded wiring, damaged protection, anchor pull-out, failed initiator/driver or
    incorrect state logic.
  local_system_effect: Ballistic/unsafe return even if control task aborts correctly.
  severity: S4
  likelihood: unknown
  likelihood_basis: No component/flight failure-rate data. Credibility follows mechanism and current unresolved
    interfaces, not a numeric probability.
  detection: Ground extraction/deployment/continuity/proof; flight sensing does not guarantee inflation.
  mitigation_design_change: Independent qualified recovery, protected snag-free pack and load-qualified
    attachments. Historical all-mode demand reaches1831.7N; the new isolated G80 probe is1782.3N, already
    DF3. Its serial paper-body cut exceeds the estimated screen. A continuous protected backbone is only
    a layout candidate; actual nose/payload/aft joints, separation mechanism, pressure isolation, switch
    access, board retention and routing remain open WO-03 design items.
  residual_risk: 'C2 rejected: local receiver-pad bond, floor/movement and actual2D harness interference
    fail. Isolated sandwich-panel improvement is not installed acceptance; no next candidate admitted.
    C1/R1 bounded preflight in docs/wo03-c1-fin-attachment.md leaves installed acceptance open; bridge
    shear/movement and R1 mass/adverse stability fail. No rigid-ground, generic bearing, unavailable thermal
    or inherited panel/flutter credit. Plugged G12 has no motor-ejection backup; redundant triggers cannot
    release a jammed pack. S2 finished loop/eye, multi-leg connector, closed-loop service and actual receiver
    remain unavailable. Recalculate the same opening case at full new mass; diagnostic S2 demand is1968.154N,
    not a measured peak or frozen1782N.'
  verification_test: Repeated repacking, cold/hot extraction, deployment and opening-load proof.
  requirements:
  - RT-RECOVERY-001
  - RT-RECOVERY-002
  interfaces:
  - IF-RECOVERY-001
  status: open
- id: FMEA-009
  failure_mode: Abort ineffective after burnout
  applicable_configurations:
  - G12-F
  - G12-L
  cause: Assuming centering is stabilizing without thrust; finless vehicle enters uncontrolled coast or
    deploys outside qualified state.
  local_system_effect: Uncontrolled attitude/recovery transition despite a centered command.
  severity: S4
  likelihood: unknown
  likelihood_basis: No component/flight failure-rate data. Credibility follows mechanism and current unresolved
    interfaces, not a numeric probability.
  detection: Thrust/time/attitude/rate state; estimator or timing error can defeat detection.
  mitigation_design_change: Qualify explicit powered-to-recovery transition per actual finless configuration
    and reject unqualified flight.
  residual_risk: No solid-motor shutdown or post-burn TVC authority; detection alone is not a safe recovery
    strategy.
  verification_test: Loss-of-thrust/timing/state/abort HIL and staged qualification.
  requirements:
  - RT-CONTROL-001
  - RT-ABORT-001
  - RT-RECOVERY-002
  interfaces:
  - IF-GIMBAL-001
  - IF-RECOVERY-001
  - IF-CONFIG-001
  status: open
- id: FMEA-010
  failure_mode: Software/timing/model-domain error
  applicable_configurations: *id001
  cause: Overrun, stale samples, policy/config error, arithmetic fault or unmodeled large-angle dynamics.
  local_system_effect: Bad or late commands; common control/recovery task lockup.
  severity: S4
  likelihood: unknown
  likelihood_basis: No component/flight failure-rate data. Credibility follows mechanism and current unresolved
    interfaces, not a numeric probability.
  detection: Watchdog/timing/validity monitors, independent state/health and logs.
  mitigation_design_change: Bounded embedded policy, validity-aware shared model, isolated recovery and
    verified fault responses.
  residual_risk: Unmodeled coupling and outside-domain operation cannot count as qualified success.
  verification_test: HIL overrun/dropout/invalid output/config/domain faults; WO-10 owner review.
  requirements:
  - RT-AERO-001
  - RT-ABORT-001
  - RT-CONFIG-001
  interfaces:
  - IF-CONFIG-001
  - IF-POWER-001
  status: open
  evidence:
  - docs/wo03-a1-connection-decision.md
- id: FMEA-011
  failure_mode: Vibration/resonance/flutter
  applicable_configurations: *id001
  cause: Flexible root/joint/gimbal, temperature-softened structure, unknown propulsion spectrum or servo
    excitation; sensor mount resonance.
  local_system_effect: Fin/structure failure or aliased sensor/controller instability.
  severity: S4
  likelihood: unknown
  likelihood_basis: No component/flight failure-rate data. Credibility follows mechanism and current unresolved
    interfaces, not a numeric probability.
  detection: Modal/torsion/vibration tests and high-rate logs; flutter onset may be abrupt.
  mitigation_design_change: Executed modal/flutter screens, stiffening/attachment corrections, damping/alias
    limits and operating envelope. Current body first modes16–26Hz and gross gimbal32.6–51.6Hz identify
    WO-06 coupled actuator/body/sensor risks. Root stiffness/peel and large-angle flutter remain open;
    component numerical agreement is not hardware qualification.
  residual_risk: 'C2 rejected: local receiver-pad bond, floor/movement and actual2D harness interference
    fail. Isolated sandwich-panel improvement is not installed acceptance; no next candidate admitted.
    C1/R1 bounded preflight in docs/wo03-c1-fin-attachment.md leaves installed acceptance open; bridge
    shear/movement and R1 mass/adverse stability fail. No rigid-ground, generic bearing, unavailable thermal
    or inherited panel/flutter credit. Crude bending–torsion criterion does not clear stall flutter, body/control
    coupling or unknown damping.'
  verification_test: Known-case/convergence, hot modal/torsion and loaded vibration; staged envelope expansion.
  requirements:
  - RT-VIB-001
  - RT-FLUTTER-001
  - RT-AERO-001
  interfaces:
  - IF-UPPER-AFT-001
  - IF-GIMBAL-001
  - IF-AVIONICS-001
  status: open
- id: FMEA-012
  failure_mode: Operating/supplier/equipment mismatch
  applicable_configurations: *id001
  cause: Unverified guide/site/wind, wrong certified hardware/delay/lot, assembly error or damaged/wet
    parts.
  local_system_effect: Poor departure, structural/control excursion or recovery failure.
  severity: S4
  likelihood: unknown
  likelihood_basis: No component/flight failure-rate data. Credibility follows mechanism and current unresolved
    interfaces, not a numeric probability.
  detection: Owner/club/RSO checks, inspection and exact equipment/source record.
  mitigation_design_change: Resolve supplier/site/equipment, operating limits and staged procedures; reject
    out-of-envelope launch.
  residual_risk: C1/R1 bounded preflight in docs/wo03-c1-fin-attachment.md leaves installed acceptance
    open; bridge shear/movement and R1 mass/adverse stability fail. No rigid-ground, generic bearing,
    unavailable thermal or inherited panel/flutter credit. No current launch authorization or exact purchasable-hardware
    freeze.
  verification_test: Preflight dry run, guide fit/friction and source/lot/configuration audit.
  requirements:
  - RT-OPS-001
  - RT-GUIDE-001
  - RT-SCOPE-001
  interfaces:
  - IF-GUIDE-001
  - IF-MOTOR-001
  - IF-CONFIG-001
  status: open
