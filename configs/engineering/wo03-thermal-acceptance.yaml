bonded_brace_sensitivities:
  fixed_mount_candidate_ids: [G80, G54]
  gap_k_bounds:
    - id: low_conductance
      radial_gap_m: 0.00068
      adhesive_conductivity_w_m_k: 0.15
    - id: nominal
      radial_gap_m: 0.00050
      adhesive_conductivity_w_m_k: 0.20
    - id: high_conductance
      radial_gap_m: 0.00032
      adhesive_conductivity_w_m_k: 0.25
  adhesive_density_kg_m3: 1200.0
  interface_contact_conductance_w_k_per_ring: [2.0, 10.0, 50.0]
  interface_contact_basis: estimated bonded-interface wetting/contact sensitivity per ring, not measured; 2-50 W/K spans approximately 3e3-8e4 W/m2K for the CAD ring contact area; replace with hot bond coupon/assembly measurements
  ideal_wetted_value_excluded_w_k: 1000000.0
  note: Rebuild mount and annular bond CAD masses for each radial gap variant; retain exact ring stations and fin-slot interruptions.
material_property_uncertainty:
  basis: coherent sensitivity corners, not statistical confidence intervals or correlated material measurements
  factors:
    - id: low_k_high_cp
      conductivity_factor: 0.7
      cp_factor: 1.3
    - id: nominal
      conductivity_factor: 1.0
      cp_factor: 1.0
    - id: high_k_low_cp
      conductivity_factor: 1.3
      cp_factor: 0.7
  use_explicit_profile_ranges_when_present: true
  adhesive_conductivity_handled_by_gap_k_bounds: true
  adhesive_cp_factor_applied: true
  density_and_geometry: use actual candidate CAD volumes/densities; unchanged except bond gap rebuild
  foil_emissivity: use case-specific engineering profile values, including epsilon0.9 degraded/contaminated sensitivity
  temperature_dependent_properties: unavailable; sensitivity does not model degradation/phase/process changes
execution:
  default_preset: tiny
  tiny_cells: 8
  sim_cells: 16
  max_step_s: 2.0
  heat_flow_postprocess_step_s: 2.0
  zero_cost: true
warm_start_proposal:
  case_id: combined_300C_eps09_at25C
  prelaunch_powered_soak_s: 600.0
  initial_condition: all thermal nodes begin at the shaded 25C ambient before arming; configured flight-computer heat is powered through the prelaunch interval
  electronics_power_source: configs/engineering/wo03.yaml thermal.electronics_heat_w[scenario_index]
  purpose: conditional operating-restriction probe only; does not modify the required 35C robustness case or any active limit
ignition_bound_proposal:
  case_id: combined_300C_eps09_at25C
  prelaunch_powered_soak_s: 0.0
  ambient_c: 25.0
  initial_temperature_c: 30.0
  initial_part_temperature_c:
    flight_computer: 40.0
    battery: 35.0
    servo_pitch: 40.0
    servo_yaw: 40.0
    servo_support: 35.0
  interpretation: controlled maximum component temperatures at ignition after shade/prearm handling; other thermal nodes are bounded at30C; this is not a measured solar-heating model
  proposed_monitoring: verify ambient25C maximum and component temperatures at ignition; owner instrumented validation in WO09/WO11 before use
  purpose: conservative ignition-condition bound only; retains combined 35C robustness requirement and all active limits
reporting:
  no_active_adoption: true
  no_limit_relaxation: true
  no_flight_ready_claim: true
  physical_validation_required:
    - Obtain exact offered motor case exterior time-temperature history or conservatively bounded measured history.
    - Measure foil emissivity before and after thermal exposure/contamination and correlate field degradation to epsilon.
    - Measure adhesive conductivity, heat capacity, bondline gap, actual wetted area and contact conductance on representative hot assemblies.
    - Instrument thermocouples at case/liner, support/mount rings, case front/aft thrust pads, outer shell, fin bond/root, avionics and TVC joints during burn and post-burn soak.
    - Verify substrate, epoxy, mica, foil, fastener and G11 temperatures and hot-joint strength on exact materials/production process.
