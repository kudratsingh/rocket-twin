  max_propellant_kg: 0.125
  max_total_impulse_ns: 160.0
  metal_structure_allowed: false
airframe:
  body_diameter_m: 0.066675
  length_m: 1.25
  nose:
    shape: ogive
    length_m: 0.16
  material_default: cardboard
aero:
  passive_stubs:
    enabled: false
    span_m: 0.07
    count: 3
    root_chord_m: 0.12
    tip_chord_m: 0.12
    sweep_m: 0.0
    position_m: 0.775
  cd_model:
    estimate: true
    type: empirical_mach_table
    reference: Mandell et al.; preliminary shape/fin estimates, not calibrated drag
    mach:
    - 0.0
    - 0.3
    - 0.6
    - 0.8
    cd:
    - 0.45
    - 0.45
    - 0.5
    - 0.65
    base_drag_cd: 0.12
motor:
  cite: configs/studies/rebaseline/motors/AeroTech_G80_2007_published.yaml
  estimate: true
  id: aerotech-g80-10t-SKU78010-provisional
  curve: configs/studies/rebaseline/motors/AeroTech_G80_2007_published.eng
  propellant_mass_kg: 0.0625
  casing_mass_kg: 0.06570000000000001
  mount_position_m: 1.092
  burn_time_s: 1.8079
  total_impulse_ns: 133.243509636
  average_thrust_n: 73.7007078024227
  ignition_delay_s: 0.0
  thrust_scale_range:
  - 0.85
  - 1.15
  qualification:
    certified_impulse_ns: 136.6
    certified_average_thrust_n: 77.6
    motor_type: commercial_solid_nonsparky
    source: Current NAR interactive listing / manufacturer summary; discrepancies
      retained in curve sidecar. Exact source/hardware/California recheck required
      before procurement.
    exact_hardware_verified: false
    california_verified: false
avionics:
  loop_rate_hz: 250.0
  physics_rate_hz: 1000.0
  estimator: madgwick
  sensors:
    imu:
      part: imu
      rate_hz: 1000.0
      accel_range_g: 16.0
      gyro_range_dps: 2000.0
    baro:
      part: baro
      rate_hz: 50.0
    high_g:
      part: high_g_accel
      rate_hz: 1000.0
      accel_range_g: 200.0
  abort:
    max_tilt_rad: 0.52
    max_rate_rad_s: 6.0
    sensor_dropout_ms: 20.0
    servo_fault_ms: 50.0
    action_on_abort:
      gimbal: centre
      recovery: arm
