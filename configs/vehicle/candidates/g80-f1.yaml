stages: []
events: []
netlist:
- net: LOGIC
  from: battery
  to:
  - logger_power_switch
  - logger_regulator
  - flight_computer
  - imu
  - baro
  - high_g_accel
  - micro_sd
- net: RECOVERY_INDEPENDENT
  from: recovery_battery
  to:
  - recovery_power_switch
  - independent_recovery
  - recovery_harness_wiring
  - recovery_output_mount
design:
  mode: performance
  mass_allowance_kg: 0.05
  rail_length_m: 1.5
  minimum_rail_exit_mps: 15.0
  screening_wind_mps: 2.0
  rail_friction_n: 0.5
  drag_coefficient_upper: 0.8
  thrust_scale_lower: 0.85
  minimum_static_margin_cal: 1.0
  minimum_control_time_s: 0.0
  target_control_time_s: 0.0
  control_thrust_to_weight: 1.2
  provenance: ADR-0013. Dedicated fixed G80 candidate. Full separate 50 g growth at
    aft end; 1.5 m usable reference; 15 formal/15.5 planning. Hardware/source hypotheses
    remain open.
recovery:
  cite: docs/wo01-rebaseline.md; canopy Cd, opening and trigger latency unmeasured
  estimate: true
  canopy_diameter_m: 0.75
  drag_coefficient: 0.75
  trigger: independent_electronic_apogee
  trigger_lag_s: 0.3
  inflation_s: 0.3
  independent_recovery_part: independent_recovery
