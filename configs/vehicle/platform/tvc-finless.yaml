  learn: The custom machined G11 cassette has an integral forward stop, three longitudinal
    rails, central grip and aft bolted retention blocks. It carries thrust through
    radial mounting screws into the two-axis gimbal; the mica liner carries no retention
    tension. Monolithic stock machining, bore ligaments, thermal gradients and fastener
    strength require engineering and physical verification.
