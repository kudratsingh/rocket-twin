      stop/rails/grip/blocks avoid relying on an unmodeled rail-end adhesive joint.
      Supplier stock, machining access, tooling and cost require WO-09 confirmation.
      Rail at 30 degrees begins 35 mm aft of the fore datum to clear the pushrod;
      only the other two forward rails carry forward-stop force. The stop has a swept-rod
      relief above radius13.9 mm; the inner ring and pads carry the fore bearing load.
