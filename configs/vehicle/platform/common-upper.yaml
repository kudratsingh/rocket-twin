class: model_rocket
scale: model
axis:
  body_x: nose
  body_z: down
  world: NED
avionics:
  loop_rate_hz: 250
  physics_rate_hz: 1000
  estimator: madgwick
  sensors:
    imu:
      part: imu
      accel_range_g: 16
      gyro_range_dps: 2000
      rate_hz: 1000
    baro:
      part: baro
      rate_hz: 50
  abort:
    max_tilt_rad: 0.52
    max_rate_rad_s: 6.0
    sensor_dropout_ms: 20
    servo_fault_ms: 50
    action_on_abort:
      gimbal: centre
      recovery: arm
limits:
  max_liftoff_mass_kg: 1.5
  max_propellant_kg: 0.125
  max_total_impulse_ns: 160
  metal_structure_allowed: false
airframe:
  body_diameter_m: 0.066
  length_m: 0.8
  nose:
    shape: ogive
    length_m: 0.14
  material_default: cardboard
parts:
- id: nose_cone
  type: nose_cone
  parent: null
  position_m: 0
  geometry:
    shape: ogive
    length_m: 0.14
    shoulder_length_m: 0.03
    wall_m: 0.0012
    radius_m: 0.033
  material: ASA
  mass_kg: 0.025
  estimate: true
  learn: Custom printed ogive and shoulder align recovery separation. ASA is a candidate
    for outdoor heat exposure; layer strength, shoulder fit and surface temperature
    require tests before flight.
  build:
    method: printed
    cost_usd: 4
    generator: nose_cone
    notes: WO-01 envelope and mass estimate; generator, tolerances, measured mass
      and strength qualification in WO-03/09.
  print:
    orientation: load_path_review_in_WO03
    layer_mm: 0.2
    infill_pct: 20
    walls: 3
    supports: false
    line_width_mm: 0.4
- id: body_upper
  type: body_tube
  parent: nose_cone
  position_m: 0.14
  geometry:
    length_m: 0.38
    radius_m: 0.033
    inner_radius_m: 0.0325
    wall_m: 0.0005
    od_m: 0.066
  material: cardboard
  mass_kg: 0.03175
  estimate: true
  learn: Thin kraft tube provides efficient axial and bending stiffness. Cut, seal,
    bond and locally reinforce the custom interfaces; crush, humidity and joint loads
    require coupon and assembly tests.
  build:
    method: cut
    cost_usd: 8
    generator: body_tube
    notes: WO-01 envelope and mass estimate; generator, tolerances, measured mass
      and strength qualification in WO-03/09.
  cite: https://www.apogeerockets.com/Building_Supplies/Body_Tubes/56mm_to_98mm_4in_Tubes/66mm_X_18in_Slotted_Body_Tube_for_TARC
    ; 38.2 g per 457.2 mm uncut tube estimate
- id: interface_coupler
  type: body_tube
  parent: body_upper
  position_m: 0.47
  geometry:
    length_m: 0.1
    radius_m: 0.0324
    inner_radius_m: 0.0314
    wall_m: 0.001
    od_m: 0.0648
  material: cardboard
  mass_kg: 0.014
  estimate: true
  learn: The keyed removable aft joint overlaps each shell by 50 mm. Bonded shear
    keys carry torque and the positive axial stop carries thrust; tolerance stack,
    retention and pull tests remain open.
  build:
    method: bonded
    cost_usd: 4
    generator: body_tube
    notes: WO-01 envelope and mass estimate; generator, tolerances, measured mass
      and strength qualification in WO-03/09.
- id: avionics_bay
  type: avionics_bay
  parent: body_upper
  position_m: 0.24
  geometry:
    length_m: 0.12
    radius_m: 0.027
  material: ASA
  mass_kg: 0.01
  estimate: true
  learn: Custom removable sled establishes the sensor reference frame and service
    access. Its envelope is not solid material; screws, vibration isolation and retention
    enter the measured assembly budget.
  build:
    method: printed
    cost_usd: 3
    generator: avionics_bay
    notes: WO-01 envelope and mass estimate; generator, tolerances, measured mass
      and strength qualification in WO-03/09.
  print:
    orientation: load_path_review_in_WO03
    layer_mm: 0.2
    infill_pct: 20
    walls: 3
    supports: false
    line_width_mm: 0.4
- id: recovery_bulkhead
  type: commercial
  parent: body_upper
  position_m: 0.225
  geometry:
    bbox_m:
    - 0.004
    - 0.06
    - 0.06
  material: plywood
  mass_kg: 0.012
  estimate: true
  learn: Custom plywood bulkhead transfers parachute loads into the upper tube rather
    than electronics. Anchor pullout, adhesive area and deployment shock loads require
    test.
  build:
    method: cut
    cost_usd: 3
    generator: commercial
    notes: WO-01 envelope and mass estimate; generator, tolerances, measured mass
      and strength qualification in WO-03/09.
- id: recovery_anchor
  type: commercial
  parent: body_upper
  position_m: 0.23
  geometry:
    bbox_m:
    - 0.02
    - 0.02
    - 0.01
  material: commercial
  mass_kg: 0.004
  estimate: true
  learn: A separate anchor and load-spreading attachment carry the recovery harness.
    This is not a promise of acceptable shock load; verify the complete recovery load
    path.
  build:
    method: assembled
    cost_usd: 3
    generator: commercial
    notes: WO-01 envelope and mass estimate; generator, tolerances, measured mass
      and strength qualification in WO-03/09.
- id: parachute
  type: commercial
  parent: body_upper
  position_m: 0.145
  geometry:
    bbox_m:
    - 0.07
    - 0.04
    - 0.04
  material: commercial
  mass_kg: 0.035
  estimate: true
  learn: A purchased 750 mm parachute is a preliminary budget for a 6 m/s descent
    screen at rho=1.1 kg/m3 and Cd=0.75. Actual canopy Cd, packing, opening shock
    and all configuration descent speeds require ground and flight validation.
  build:
    method: purchased
    cost_usd: 30
    generator: commercial
    notes: WO-01 envelope and mass estimate; generator, tolerances, measured mass
      and strength qualification in WO-03/09.
- id: shock_cord
  type: commercial
  parent: body_upper
  position_m: 0.18
  geometry:
    bbox_m:
    - 0.02
    - 0.02
    - 0.01
  material: commercial
  mass_kg: 0.01
  estimate: true
  learn: A heat-resistant recovery harness gives separation travel and transfers opening
    load. Chafe protection, knots, attachment and packing are represented and must
    be qualified together.
  build:
    method: purchased
    cost_usd: 12
    generator: commercial
    notes: WO-01 envelope and mass estimate; generator, tolerances, measured mass
      and strength qualification in WO-03/09.
- id: recovery_protection
  type: commercial
  parent: body_upper
  position_m: 0.19
  geometry:
    bbox_m:
    - 0.02
    - 0.02
    - 0.01
  material: commercial
  mass_kg: 0.006
  estimate: true
  learn: A flame-resistant blanket isolates the packed parachute from ejection gas.
    Packing fit and repeatable deployment need ground tests; it is not an airframe
    thermal qualification.
  build:
    method: purchased
    cost_usd: 8
    generator: commercial
    notes: WO-01 envelope and mass estimate; generator, tolerances, measured mass
      and strength qualification in WO-03/09.
- id: independent_recovery
  type: commercial
  parent: avionics_bay
  position_m: 0.23
  geometry:
    bbox_m:
    - 0.02
    - 0.02
    - 0.01
  material: commercial
  mass_kg: 0.008
  estimate: true
  learn: Purchased independent apogee recovery electronics remain separate from the
    experimental control policy. Exact unit, sensing behavior, power isolation and
    deployment sequence require WO-09/10 verification.
  build:
    method: purchased
    cost_usd: 95
    generator: commercial
    notes: WO-01 envelope and mass estimate; generator, tolerances, measured mass
      and strength qualification in WO-03/09.
- id: micro_sd
  type: commercial
  parent: avionics_bay
  position_m: 0.26
  geometry:
    bbox_m:
    - 0.02
    - 0.02
    - 0.01
  material: commercial
  mass_kg: 0.003
  estimate: true
  learn: The log card records raw sensors, estimates, commands, fault state and supply
    voltage. Buffered writes and recovery from a full or failed card must preserve
    the control deadline.
  build:
    method: purchased
    cost_usd: 10
    generator: commercial
    notes: WO-01 envelope and mass estimate; generator, tolerances, measured mass
      and strength qualification in WO-03/09.
- id: adhesive_finish
  type: commercial
  parent: body_upper
  position_m: 0.3
  geometry:
    bbox_m:
    - 0.12
    - 0.02
    - 0.01
  material: commercial
  mass_kg: 0.012
  estimate: true
  learn: Distributed adhesive, tube sealer and finish are included as a lumped mass
    estimate. Replace this surrogate with measured joint and coating masses before
    hardware validation.
  build:
    method: bonded
    cost_usd: 8
    generator: commercial
    notes: WO-01 envelope and mass estimate; generator, tolerances, measured mass
      and strength qualification in WO-03/09.
- id: rail_guides
  type: rail_guide
  parent: body_upper
  position_m: 0.25
  geometry:
    bbox_m:
    - 0.02
    - 0.02
    - 0.01
    count: 2
  material: ASA
  mass_kg: 0.006
  estimate: true
  learn: Two purchased or custom rail guides maintain attitude during initial acceleration.
    The mass covers both guides; final spacing, rail engagement and positive clearance
    are CAD and range checks.
  build:
    method: printed
    cost_usd: 3
    generator: rail_guide
    notes: WO-01 envelope and mass estimate; generator, tolerances, measured mass
      and strength qualification in WO-03/09.
  print:
    orientation: load_path_review_in_WO03
    layer_mm: 0.2
    infill_pct: 20
    walls: 3
    supports: false
    line_width_mm: 0.4
- id: flight_computer
  type: commercial
  parent: avionics_bay
  position_m: 0.215
  geometry:
    bbox_m:
    - 0.061
    - 0.018
    - 0.006
  mass_kg: 0.012
  electrical:
    supply_v: 5.0
    current_a: 0.1
  learn: The Cortex-M7 FPU supports estimation and small policies at 250 Hz. SD logging
    preserves raw sensor and control traces. Power transients and blocking writes
    can violate the loop deadline; current and mass are estimates.
  estimate: true
  cg_offset_m: 0.0305
  build:
    method: purchased
    cost_usd: 32
    generator: commercial_envelope
    notes: Budget estimate; exact component datasheet, price, mass and mounting interface
      must be frozen in WO-09.
- id: imu
  type: commercial
  parent: avionics_bay
  position_m: 0.24
  geometry:
    bbox_m:
    - 0.02
    - 0.015
    - 0.004
  mass_kg: 0.002
  electrical:
    supply_v: 3.3
    bus: SPI
  learn: Gyros track angular rates; accelerometers measure specific force, not gravity
    alone during thrust. Bias and axis alignment matter for attitude estimation. Rigid
    alignment and vibration characterization are needed before trusting this sensor.
  estimate: true
  cg_offset_m: 0.01
  build:
    method: purchased
    cost_usd: 18
    generator: commercial_envelope
    notes: Budget estimate; exact component datasheet, price, mass and mounting interface
      must be frozen in WO-09.
- id: baro
  type: commercial
  parent: avionics_bay
  position_m: 0.245
  geometry:
    bbox_m:
    - 0.015
    - 0.012
    - 0.003
  mass_kg: 0.001
  electrical:
    supply_v: 3.3
    bus: SPI
  learn: Ambient pressure provides a height estimate through an atmosphere model.
    Static ports must avoid stagnation and wake pressure. Burn-time acceleration does
    not directly invalidate pressure, but airflow and filtering can bias and delay
    the reading.
  estimate: true
  cg_offset_m: 0.0075
  build:
    method: purchased
    cost_usd: 15
    generator: commercial_envelope
    notes: Budget estimate; exact component datasheet, price, mass and mounting interface
      must be frozen in WO-09.
- id: battery
  type: commercial
  parent: avionics_bay
  position_m: 0.21
  geometry:
    bbox_m:
    - 0.055
    - 0.03
    - 0.015
  mass_kg: 0.03
  electrical:
    nominal_v: 7.4
    capacity_mah: 450
    max_discharge_a: 9
  learn: A 2S pack supplies regulator headroom through discharge. Servo current spikes
    can brown out logic unless rails and decoupling are sized correctly. Capacity,
    mass and discharge rating are estimates pending a selected cell and measurements.
  estimate: true
  cg_offset_m: 0.0275
  build:
    method: purchased
    cost_usd: 18
    generator: commercial_envelope
    notes: Budget estimate; exact component datasheet, price, mass and mounting interface
      must be frozen in WO-09.
- id: regulator_5v
  type: commercial
  parent: avionics_bay
  position_m: 0.28
  geometry:
    bbox_m:
    - 0.025
    - 0.018
    - 0.008
  material: commercial
  mass_kg: 0.008
  cg_offset_m: 0.0125
  estimate: true
  learn: The regulator supplies logic and servos from the 2S battery. Its estimated
    current capacity must cover simultaneous stalls with thermal margin. Noise isolation
    and brownout behavior require bench validation.
  build:
    method: purchased
    cost_usd: 10
    generator: commercial_envelope
    notes: Budget estimate; exact component datasheet, price, mass and mounting interface
      must be frozen in WO-09.
- id: pyro_mosfet
  type: commercial
  parent: avionics_bay
  position_m: 0.28
  geometry:
    bbox_m:
    - 0.02
    - 0.015
    - 0.005
  material: commercial
  mass_kg: 0.003
  cg_offset_m: 0.01
  estimate: true
  learn: This board reserves the later electronic recovery channel in the netlist.
    Its electrical ratings are estimates; continuity, arming and fault behavior must
    be verified before connection to any recovery device.
  build:
    method: purchased
    cost_usd: 8
    generator: commercial_envelope
    notes: Budget estimate; exact component datasheet, price, mass and mounting interface
      must be frozen in WO-09.
- id: arming_switch
  type: commercial
  parent: avionics_bay
  position_m: 0.28
  geometry:
    bbox_m:
    - 0.012
    - 0.008
    - 0.01
  material: commercial
  mass_kg: 0.003
  cg_offset_m: 0.006
  estimate: true
  learn: The arming switch gives an explicit hardware enable state. Contact rating
    and wiring must withstand the intended loads. Estimated mass and rating must be
    replaced by selected component data.
  build:
    method: purchased
    cost_usd: 5
    generator: commercial_envelope
    notes: Budget estimate; exact component datasheet, price, mass and mounting interface
      must be frozen in WO-09.
- id: harness
  type: commercial
  parent: avionics_bay
  position_m: 0.28
  geometry:
    bbox_m:
    - 0.1
    - 0.015
    - 0.01
  material: commercial
  mass_kg: 0.01
  cg_offset_m: 0.05
  estimate: true
  learn: The harness accounts for wires, connectors and strain relief. Voltage drop
    and intermittent contacts can remove control authority. This is a lumped mass
    estimate; the generated wiring and measured harness will replace it.
  build:
    method: assembled
    cost_usd: 12
    generator: commercial_envelope
    notes: Budget estimate; exact component datasheet, price, mass and mounting interface
      must be frozen in WO-09.
netlist:
- net: VBAT
  from: battery
  to: regulator_5v
  gauge_awg: 22
- net: 5V_LOGIC
  from: regulator_5v
  to: flight_computer
  gauge_awg: 26
- net: SPI
  from: flight_computer
  to:
  - imu
  - baro
- net: PYRO_1
  from: flight_computer
  to: pyro_mosfet
  pin: null
- net: ARM
  from: arming_switch
  to: flight_computer
  pin: null
- net: RECOVERY_INDEPENDENT
  from: battery
  to: independent_recovery
  gauge_awg: 24
