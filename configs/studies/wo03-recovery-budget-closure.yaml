branch_attachments:
  main: Canopy shroud/tape attachment -> aramid leader -> HMPE main -> rounded junction. Each interface and its termination remains unrated.
  nose: Rounded junction -> separate HMPE line -> proposed positive nose attachment; no existing printed shoulder or central eye rating is credited.
  body: Rounded junction -> body line -> two retained wrap bands; bulkhead local retention and shell tear/peel/slip remain unrated.
  coupler: Rounded junction -> separate coupler line -> proposed positive pins through a nonmetallic collar; 0.8 g is still a reserve, not implemented/rated hardware.
  sled: Rounded junction -> separate sled line -> two counted G11 tabs -> avionics sled/carrier; board and battery mounts remain the separate packaging proposal.
  aft: Rounded junction -> three legs -> full 8 mm G11 fixed frame or 9.5 mm fixed fore plate -> actual rails/rings/joints -> fins, motor retention and shell. No direct frame-to-shell path is assumed rated.
