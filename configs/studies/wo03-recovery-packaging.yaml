open_questions:
  - Exact Schurter 0033.4518 drawing, bushing length, anti-rotation/retention stack and DC contact rating.
  - Exact EasyMini terminal/pressure-port keepouts and board orientation versus the drawing.
  - Cell connector polarity, pulse sag, cell retention and validation by approved ground-load test.
  - Real flexible-wire bend and strain-relief path, arming-hole physical access, connector service access.
  - Crossbar local reinforcement print process, captive nuts, screw lengths and extraction path.
  - G11-to-sled attachment strength, component relief adequacy and standoff/screw preload.
  - No physical fit, deployment proof, electrical fault test or hardware release is claimed.
