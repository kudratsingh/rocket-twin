    switch_g: 3.7
    switch_g11_doubler_g_by_cad_volume: 2.078
    wire_connectors_strain_relief_g: 4.0
  estimate_only: true
  note: The script replaces the prior 1.717 g carrier/pin solids and subtracts CAD-derived new tray, band, fastener and reinforcement masses from the separate old 6.283 g allowance; it retains the calculated residual as budget mass. G11 carrier and doubler CAD masses use geometry volume times estimated density. No mass is set to zero to force parity.

netlist:
  required_edges:
    - {net: RECOVERY_BAT_POS, from: recovery_battery, to: recovery_power_switch}
    - {net: RECOVERY_ARMED_POS, from: recovery_power_switch, to: independent_recovery}
    - {net: RECOVERY_RETURN, from: recovery_battery, to: independent_recovery}
    - {net: RECOVERY_OUTPUT_BUNDLE, from: independent_recovery, to: recovery_output_harness}
  prohibited_edges:
    - RECOVERY_INDEPENDENT
    - main battery positive or return
    - servo/flight computer grounds or GPIO
  note: Functional isolation boundary only; no energetic device, firing circuit or output current is modeled.

