protocol:
  detail: docs/validation/rp1-vp1/protocol.md
  material_strip_mm: [270, 25, nominal6]
  spans_mm: [240, 180, 120]
  primary_span_mm: 240
  heldout_span_mm: 180
  short_span_scope: diagnostic_only_no_home_G_identification
  why_changed_from_D1: Longer stock amplifies bending signal; D1 150mm/60-120mm was a provisional fixture, not an engineering acceptance requirement.
  conditions: [room_dry, dry45C, humid45C]
  independent_strips_per_direction_condition: 5
  directions: [face_grain_spanwise, face_grain_crosswise]
  fit_vs_holdout_per_cell: [3, 2]
  T_joint_replicates_per_route_condition: 3
  routes: [wood_to_actual_motor_tube, wood_to_actual_body]
  complete_root_replicates: 3
  root_temperatures_and_conditioning_order: Same three articles room_dry then dry45C then humid45C; cumulative-conditioning evidence, not independent virgin hot allowables.
  root_U95_tip_equivalent_mm_max: 0.01
  root_U95_force_relative_max: 0.01
  root_U95_moment_relative_max: 0.01
  coupon_lab_displacement_U95_mm_max: 0.01
  fit_uncertainty_limit_relative: 0.10
  home_only_triage_uncertainty_limit_relative: 0.35
  home_triage_can_qualify_joint_or_G: false
  distributed_panel_loading_verified: false
  root_measurement_rule: Replace exactly corresponding tab/support model terms, never add entire measured root to FP1 tab plus0.100mm. Unmeasured global body remains unavailable.
  complete_fin_acceptance: Measured/validated total displacement plus uncertainty <=1mm under equivalent distributed load, retained strength screens, actual conditioned geometry; root-input fixture alone does not establish this.
  separate_open_gates: [full_thermal_matrix, recovery, installed_flutter, physical_vehicle_inspection, exact_motor_retainer, firmware_WO10, flight_release]
