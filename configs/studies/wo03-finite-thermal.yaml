limitations:
  - Material-node condensation is an exact radiosity algebra reduction at supplied patch temperature groups, not proof that material-node temperatures equal surface temperatures.
  - A replacement transient must solve gas conduction and radiation at the same physical surfaces behind solid half-wall resistances. This runner does not integrate a transient.
  - New foil baffle, mica pad and adhesive temperatures are unavailable. Explicit cold/hot diagnostic probes are assumptions using recorded mount/original-foil values, not predicted or measured baffle histories.
  - The fully specified three-sector mica supports and adhesive layers are in the mass/contact ledger but excluded from the coaxial ray geometry. They are never replaced by opaque full annular pads.
  - The 0.230 mm nominal foil-end gap is not a tolerance, warpage, assembly, bond or vibration pass.
  - Fin slots, rails, seams, actual end/nozzle/upper-bay geometry and other original diagnostic exclusions remain. No conservative complete-CAD bound is claimed.
  - Foil emissivity stays 0.9; the required 300 C case, 35 C ambient and 45 C substrate screen are unchanged.
