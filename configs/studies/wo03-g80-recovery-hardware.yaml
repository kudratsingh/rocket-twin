    rating_current_a: 2
    rating_voltage_vdc: 28
    applicability: documented_series_rating_for_non_TX01_models; covers_1A_3.7V_screen_only
    electrical_life_cycles_at_full_load: 30000
    panel_cutout_mm: 4.95
    bushing_thread: 10-48UNS-2A
    bushing_height_mm: 5.59
    actuator_height_mm: 9.40
    series_envelope_body_mm_estimated_from_drawing: [8.13, 5.08]
    solder_lug_span_mm_estimated_from_drawing: 4.06
    lug_clearance_required: true
    mass_g_published: null
    mass_g_study_placeholder_estimate: 2.0
    panel_thickness_limit_published_in_reviewed_sheet: null
    caution: >-
      Candidate needs a new 4.95 mm panel feature and physical access review. This
      does not fit the existing 12.7/15.875 mm SWA1 interface as-designed. A 1 A
      screening rating is not qualification of a selected output/charge pulse.
    accidental_actuation_risk: >-
      Small toggle could be snagged or bumped. Later design should recess or guard
      it without obstructing deliberate access, distinguish it from the existing
      flight-computer switch, and verify OFF/ON position during handling.
