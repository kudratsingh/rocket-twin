configuration_decision:
  controller: Altus Metrum EasyMini v3.0
  battery: Altus Metrum / Garbee and Garbee 1S 120 mAh LiPo
  historical_package_switch: Schurter SWA1 0033.4518, 0/1 legend variant
  proposed_switch_for_primary_review: C&K T102SHZQE
  switch_alternate_reviewed: E-Switch 200MSP3T1B1M2QEH
  status: component proposal for primary review; no hardware/design adoption
  blocking_item: >-
    The C&K candidate has a documented 2 A / 28 VDC Q-contact series rating, which
    covers the 1 A at 1S screening assumption only. Actual load/pulse current and
    selected hardware duty are not frozen, the existing SWA1 hole stack is not a
    designed C&K mount, and the C&K mass is not published. No design change before
    primary review.

components:
  controller:
    model: EasyMini v3.0
    nominal_outline_mm: [38.1, 20.32]
    published_mass_g: 6.5
    published_supply_v: [3.7, 12.0]
    mounting_pattern_mm: [13.97, 31.75]
    screw_compatibility: 4-40_or_M3
    board_thickness_mm: null
    thickness_envelope_mm_estimate: 6.0
    sources:
      product: https://altusmetrum.org/EasyMini/
      outline: https://altusmetrum.org/AltOS/doc/easymini-outline.pdf
      manual: https://altusmetrum.org/AltOS/doc/easymini.html
    mechanical_unknowns:
      - Exact v3.0 component, terminal, USB and pressure-aperture keepouts from the PCB artwork.
      - Installed board orientation and access to the screw terminals and programming port.
      - Unobstructed static pressure exposure through a properly located airframe port.
  cell:
    model: Altus Metrum 1S LiPo 120 mAh
    nominal_voltage_v: 3.7
    nominal_capacity_mah: 120
    seller_dimensions_mm_approx: [30, 15, 4]
    seller_mass_g: 3.6
    connector: 2-pin_JST_PH_2mm_pitch
    overcurrent_protection: absent_per_seller
    sources:
      seller: https://shop.gag.com/product/120mah-lipo-battery/
      controller_manual: https://altusmetrum.org/AltOS/doc/easymini.html
    required_checks:
      - Inspect the actual lead/connector polarity and board-revision mating orientation before connection.
      - Verify retention, lead exit, bend, strain relief, pulse sag and cell condition under the authorized ground-test procedure.
  switch:
    historical_package_variant: 0033.4518
    series: SWA1_Frontpl_voltage_selector
    legend: "0 / 1"
    contact_form_seller_description_of_sibling_0033_4501: DPST_with_four_terminals; seller says it may be wired as SPST
    manufacturer_family_rating: 6.3_A_at_250_VAC_only
    manufacturer_lifetime: 300_unloaded_operating_cycles
    dc_rating: null
    seller_dimensions_reference_sibling_mm: [28.575, 15.875, 12.7]
    seller_body_panel_hole_mm: 12.7
    seller_bezel_clearance_mm: 15.875
    estimate_cad_mass_g: 3.7
    sources:
      manufacturer_family: https://www.schurter.com/en/datasheet/SWA1__Frontpl_
      seller_sibling_0033_4501: https://shop.gag.com/product/rotary-switch/
      seller_manufacturer_drawing: https://www.schurter.com/en/pdf/english/typ_swa1__frontpl_.pdf
    interface_check_for_future_integration:
      current_wall_hole_mm: 15.875
      inner_doubler_opening_mm: 12.7
      note: >-
        This two-layer opening pair may match the seller's flush-mount method for
        a 5/8-inch airframe opening and 1/2-inch coupler opening. Verify the exact
        0033.4518 drawing and actual wall/doubler stack; this source check does not
        establish the installed fit.
  recommended_for_primary_review:
    manufacturer: C&K / Littelfuse
    exact_variant: T102SHZQE
    series_data: https://www.ckswitches.com/media/1391/ttoggle.pdf
    function: two_position_OFF_ON_SPST_operating_function_family_prose_inconsistent
    proposed_wiring: terminal_2_common_to_cell_positive; terminal_1_switched_output; terminal_3_isolated_unused
