electrical_intent:
  topology:
    - {net: RECOVERY_BAT_POS, from: recovery_battery, to: recovery_power_switch}
    - {net: RECOVERY_ARMED_POS, from: recovery_power_switch, to: independent_recovery}
    - {net: RECOVERY_RETURN, from: recovery_battery, to: independent_recovery}
    - {net: RECOVERY_OUTPUT_BUNDLE, from: independent_recovery, to: recovery_output_harness}
  isolation_requirement: >-
    Keep recovery positive and return local to its dedicated cell and EasyMini;
    do not join to main battery, flight-computer/servo ground, shared GPIO,
    USB/data, sensors or conductive chassis paths. Check physical continuity and
    fault isolation separately; this is only netlist intent.
  switch_role: positive_battery_disconnect_only
  energetic_device_or_output_load: unspecified
  output_current_requirement_a: null
  physical_electrical_test: not_performed

interfaces_not_closed:
  - Exact output-load/pulse current and whether the selected 1A screening basis represents the use case.
  - Primary review of the C&K switch recommendation before any design change.
  - New C&K panel hole, body/lug clearance, panel thickness/retention and independent arming access.
  - EasyMini pressure aperture/port layout, ambient reference quality and avoidance of wake/stagnation pressure.
  - Connector polarity/orientation, flexible cable bend, strain relief and service extraction.
  - Battery current delivery under the approved representative load; no pulse result is implied by capacity.
  - Common-cause electrical isolation, carrier attachment strength, vibration retention and deployment load path.

