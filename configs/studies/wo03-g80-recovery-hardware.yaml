id: wo03-g80-recovery-hardware-interface
status: bounded-component-interface-proposal-not-hardware-qualified
scope: >-
  Document a candidate independent G80 recovery power/controller interface using
  the already-completed recovery packaging geometry and the separately selected
  32.2 mm G80 mount-radius proposal. This file does not alter active vehicle
  specifications, CAD, wiring, loads, or the completed packaging result.

