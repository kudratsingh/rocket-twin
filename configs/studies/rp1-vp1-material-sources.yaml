  - id: WEST_105_206_TDS
    url: https://www.westsystem.com/app/uploads/2022/12/105-206-Epoxy-Resin.pdf
    owner: WEST SYSTEM / Gougeon Brothers
    access: readable_pdf
    observed: 105 resin/206 Slow Hardener; 5 to 1 by volume or 5.36 to 1 by weight; 16 C minimum recommended; thin-film working time 90-110 min, solid cure 10-15 h, working strength 1-4 days at stated conditions. General wood/composite bonding and wet-out.
    limitation: Resin bulk/thermal figures, including Tg, do not qualify a loaded paper/wood/tube joint or its 45 C substrate screen; no exact mixed-adherend film or peel allowable.
  - id: WEST_105_system
    url: https://www.westsystem.com/products/105-system/
    owner: WEST SYSTEM
    access: readable
    observed: 105-A resin is 1 quart; pair with matching A group 206 Slow Hardener. Page states 206 minimum cure temperature 16 C and thin-film work time 90-110 min at 22 C; technical support phone shown.
    limitation: Manufacturer product page does not show live dealer inventory or a delivered kit price.
  - id: WEST_surface_preparation
    url: https://www.westsystem.com/instruction/epoxy-basics/surface-preparation/
    owner: WEST SYSTEM
